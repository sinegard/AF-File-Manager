name: Publish signed APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Validate tag and Gradle version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([0-9][0-9.]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          printf 'AF_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Restore private release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AF_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/af-file-manager-release.jks"
          chmod 600 "$RUNNER_TEMP/af-file-manager-release.jks"

      - name: Test, lint, and build the signed release
        env:
          AF_KEYSTORE_PATH: ${{ runner.temp }}/af-file-manager-release.jks
          AF_KEYSTORE_PASSWORD: ${{ secrets.AF_KEYSTORE_PASSWORD }}
          AF_KEY_ALIAS: ${{ secrets.AF_KEY_ALIAS }}
          AF_KEY_PASSWORD: ${{ secrets.AF_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          mkdir -p dist
          apk="dist/AF-File-Manager-$AF_VERSION.apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/AF-File-Manager-$AF_VERSION.apk#Signed Android APK" \
            "dist/AF-File-Manager-$AF_VERSION.apk.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "AF File Manager $AF_VERSION" \
            --generate-notes
