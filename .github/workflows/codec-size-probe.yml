name: Codec payload experiment

on:
  push:
    branches: ["codex/codec-probe-*"]

permissions:
  contents: read

concurrency:
  group: codec-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out experiment source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare the pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" != main
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" >/dev/null
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          grep -q 'Pkg.Revision = 27.3.13750724' "$ANDROID_NDK_ROOT/source.properties"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
      - name: Build the restricted export payloads
        shell: bash
        run: bash scripts/media-export/build.sh
      - name: Retain experiment outputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: codec-probe-${{ github.sha }}
          path: app/build/native-media/dist/
          retention-days: 3
          if-no-files-found: error
