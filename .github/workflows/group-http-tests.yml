name: Generate offline UI language packs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: af-temporary-language-generation-20261017
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/codex/af-language-packs-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Check out the temporary catalog
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up the development Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - name: Check memory reserve and install development tools
        run: |
          python - <<'PY'
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available = int(mem['MemAvailable'].split()[0]) * 1024
          assert 6 * 1024**3 <= available * 0.75, 'Insufficient memory with 25% reserve'
          print(f'MemAvailable={available}; required=6442450944; reserve=25%')
          PY
          python -m pip install --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==5.16.1 sentencepiece==0.2.1
          python -m pip check
          python -m pip freeze > language-generation-dependencies.txt
      - name: Generate missing copy and repair English prose fallbacks with the pinned model
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/af-translation-model
        run: |
          python -m unittest discover -s scripts -p test_generate_ui_translations.py
          python - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          from huggingface_hub import snapshot_download
          import torch
          torch.set_num_threads(4)
          torch.set_num_interop_threads(1)
          revision = 'f8d333a098d19b4fd9a8b18f94170487ad3f821d'
          model = snapshot_download('facebook/nllb-200-distilled-600M', revision=revision,
              allow_patterns=['config.json', 'generation_config.json', 'tokenizer.json',
                  'tokenizer_config.json', 'special_tokens_map.json', 'sentencepiece.bpe.model', 'pytorch_model.bin'])
          spec = importlib.util.spec_from_file_location('af_generator', 'scripts/generate-ui-translations.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.MODEL_NAME = model
          source = module.collect_catalog()
          inputs = [module.UI_TRANSLATOR, module.RUNTIME_TRANSLATIONS, module.DEFAULT_STRINGS,
              Path('scripts/generate-ui-translations.py'), module.OVERRIDES_PATH]
          fingerprint = {str(p): hashlib.sha256(p.read_text(encoding='utf-8').replace('\r\n', '\n').encode('utf-8')).hexdigest() for p in inputs}
          before_fallbacks = {}
          for language in module.LANGUAGES:
              exact, templates = module.load_pack(module.ASSET_DIRECTORY / f'{language}.json')
              before_fallbacks[language] = [value for value, translated in zip(source.exact + source.templates, exact + templates, strict=True)
                  if module.is_english_prose_fallback(value, translated)]
          sys.argv = ['generate-ui-translations.py', '--update-existing', '--retry-english-fallbacks', '--batch-size', '16']
          module.main()
          after_fallbacks = {}
          for language in module.LANGUAGES:
              exact, templates = module.load_pack(module.ASSET_DIRECTORY / f'{language}.json')
              after_fallbacks[language] = [value for value, translated in zip(source.exact + source.templates, exact + templates, strict=True)
                  if module.is_english_prose_fallback(value, translated)]
          Path('language-fallback-audit.json').write_text(json.dumps({'before': before_fallbacks, 'after': after_fallbacks}, ensure_ascii=False, indent=2) + '\n')
          sys.argv = ['generate-ui-translations.py', '--verify-only']
          module.main()
          outputs = sorted(module.ASSET_DIRECTORY.glob('*.json'))
          outputs += sorted(module.RESOURCE_DIRECTORY.glob('values-*/strings.xml'))
          manifest = {'source_commit': os.environ['GITHUB_SHA'], 'model_revision': revision,
              'inputs': fingerprint, 'exact_count': len(source.exact), 'template_count': len(source.templates),
              'languages': sorted(module.LANGUAGES),
              'outputs': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in outputs}}
          Path('language-generation-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload generated text only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: af-offline-language-packs
          retention-days: 7
          if-no-files-found: error
          path: |
            app/src/main/assets/i18n/*.json
            app/src/main/res/values-*/strings.xml
            language-generation-manifest.json
            language-generation-dependencies.txt
            language-fallback-audit.json
