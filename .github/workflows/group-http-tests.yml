name: Generate document-storage language packs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: af-document-languages-20261029
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/codex/af-document-languages-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      AF_LANGUAGE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - name: Prepare bounded development translator
        run: |
          python - <<'PY'
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          assert 6 * 1024**3 <= int(memory['MemAvailable'].split()[0]) * 1024 * .75
          PY
          python -m pip install --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==5.16.1 sentencepiece==0.2.1
          python -m pip check
          python -m pip freeze > language-generation-dependencies.txt
      - name: Generate only missing offline messages
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/af-translation-model
        run: python scripts/af-generate-document-languages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: af-document-language-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error
          path: language-shard/
